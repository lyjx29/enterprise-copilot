[project]
name = "fincopilot"
version = "0.1.0"
description = "FinCopilot - 多源自适应财务分析师 Copilot（RAG / SQL / Web）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # 配置 / 校验
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    # 可观测
    "structlog>=24.1",
    # 编排（LangGraph 1.x，与课程一致）
    "langgraph>=1.2,<2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    # 检索（企业级混合检索）
    "qdrant-client>=1.9",
    "rank-bm25>=0.2.2",
    "sqlglot>=25",
    # Web 实时搜索（兜底路径；ddgs 为 duckduckgo-search 的新包名，支持多后端）
    "ddgs>=9",
    # SQL 工具（员工库访问）
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
# 文档摄取（M1 seed 用 pypdf；M4 正式管线加 Docling，体积大故单列）
ingest = [
    "pypdf>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]  # 行长交给 ruff format

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
